name: Release production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Approved main commit (full 40-character SHA)'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY_PRODUCTION after backup, migration, rollback and sync-owner checks'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airline
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: airline_operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airline -d airline_operations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: muc_online_app
    steps:
      - name: Verify explicit approval, current main and successful push CI
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = DEPLOY_PRODUCTION
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$TARGET_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=100" | jq -e --arg sha "$TARGET_SHA" 'any(.workflow_runs[]; .head_sha == $sha and .status == "completed" and .conclusion == "success")'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: muc_online_app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # 测试期模块 env（job 级注入）：server.mjs 加载时固化 cosConfig/APP_VERSION，
      # 测试文件内晚赋值在慢 runner 上输掉竞态（同 PR#55 修复的 ci.yml 问题）。
      - run: COS_SECRET_ID=test-secret-id COS_SECRET_KEY=test-secret-key COS_BUCKET=test-bucket-1234567890 COS_REGION=ap-shanghai APP_VERSION=test-version npm run check && COS_SECRET_ID=test-secret-id COS_SECRET_KEY=test-secret-key COS_BUCKET=test-bucket-1234567890 COS_REGION=ap-shanghai APP_VERSION=test-version npm test
      - name: Build approved release
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: bash deploy/tencent/build-release.sh "production-$RELEASE_SHA" /tmp/airline-operations-center.tar.gz
      - name: Verify this exact final artifact before publication
        run: node scripts/check-integration-package.mjs /tmp/airline-operations-center.tar.gz '${{ inputs.commit_sha }}' --check
        env:
          ATTENDANCE_TEST_DATABASE: 'true'
          DATABASE_URL: postgresql://airline:test-password@127.0.0.1:5432/airline_operations
          PGSSLMODE: disable
      - uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: |
            /tmp/airline-operations-center.tar.gz
            /tmp/airline-operations-center.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release
          path: release
      - name: Publish explicitly approved immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          gh release create "production-$RELEASE_SHA" release/airline-operations-center.tar.gz release/airline-operations-center.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --title "Production $RELEASE_SHA" --notes "Explicitly approved production release for commit $RELEASE_SHA." --latest
